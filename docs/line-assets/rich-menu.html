<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>LINE 圖文選單</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2500px;height:843px;background:#fff;font-family:"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
.g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);width:2500px;height:843px}
.c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;border-right:3px solid #EDEEF0;border-bottom:3px solid #EDEEF0}
.c:nth-child(3n){border-right:0}.c:nth-child(n+4){border-bottom:0}
.ic{width:150px;height:150px;border-radius:40px;background:#EEF5FD;display:flex;align-items:center;justify-content:center}
.c.pri .ic{background:#1469D4}
svg{width:84px;height:84px;fill:none;stroke:#1469D4;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c.pri svg{stroke:#fff}
span{font-size:68px;font-weight:600;color:#1A1A1A;letter-spacing:.02em}
</style></head><body><div class="g">
<div class="c pri"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.6-2.7 2.6"/><path d="M12 16.8h.01"/></svg></div><span>說明</span></div>
<div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-10a2 2 0 0 1 2-2h11"/><path d="M16 13.5h.01"/></svg></div><span>我的代墊</span></div>

<div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg></div><span>切換組織</span></div>

</div></body></html>
