name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # Generate wrangler.jsonc from the example template,
      # replacing placeholders with secrets / env vars.
      - name: Generate wrangler.jsonc
        run: |
          sed \
            -e 's/"my-app"/"${{ vars.WORKER_NAME || 'internal' }}"/' \
            -e 's|"app.example.com"|"${{ vars.WORKER_ROUTE }}"|' \
            -e 's/"my-app-storage"/"${{ vars.R2_BUCKET_NAME || 'internal-storage' }}"/' \
            wrangler.jsonc.example > wrangler.jsonc

      - name: Build & Deploy
        run: bun run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
