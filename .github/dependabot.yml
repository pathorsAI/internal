version: 2
updates:
  # Bun reads and writes bun.lock; Dependabot handles Bun projects through the
  # "bun" ecosystem.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[chore]"
    groups:
      # One PR per week for all minor and patch bumps. Major versions still get
      # their own PR, since those are the ones that need reading.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[chore]"
    groups:
      github-actions:
        patterns:
          - "*"
