<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Pathors Internal">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1469D4" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.82" cy="0" r="0.75">
      <stop offset="0.15" stop-color="#fff"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="paper">
      <rect width="1280" height="360" fill="url(#fade)"/>
    </mask>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DB6F3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DB6F3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="#FBFBFC"/>
  <rect width="1280" height="360" fill="url(#grid)" mask="url(#paper)"/>
  <ellipse cx="1120" cy="20" rx="320" ry="210" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#E4E6EA"/>

  <!-- twin-page mark: one transaction, two books -->
  <g transform="translate(120,116)">
    <rect x="16" y="16" width="72" height="72" rx="20" fill="#1469D4"/>
    <rect x="45" y="45" width="66" height="66" rx="17" fill="#FFFFFF" stroke="#1469D4" stroke-width="10"/>
  </g>

  <!-- wordmark -->
  <text x="288" y="172" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">
    <tspan fill="#15171A">Pathors</tspan><tspan fill="#646A74" font-weight="600">&#160;Internal</tspan>
  </text>
  <text x="290" y="220" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="500" fill="#646A74">
    Self-hosted internal accounting &amp; client-finance management
  </text>

  <!-- tech tags -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="500">
    <g transform="translate(290,250)">
      <rect x="0.5" y="0.5" width="117" height="33" rx="6" fill="#FFFFFF" stroke="#E4E6EA"/>
      <text x="59" y="23" text-anchor="middle" fill="#454A53">Next.js 16</text>
    </g>
    <g transform="translate(420,250)">
      <rect x="0.5" y="0.5" width="97" height="33" rx="6" fill="#FFFFFF" stroke="#E4E6EA"/>
      <text x="49" y="23" text-anchor="middle" fill="#454A53">Drizzle</text>
    </g>
    <g transform="translate(530,250)">
      <rect x="0.5" y="0.5" width="111" height="33" rx="6" fill="#FFFFFF" stroke="#E4E6EA"/>
      <text x="56" y="23" text-anchor="middle" fill="#454A53">Postgres</text>
    </g>
    <g transform="translate(654,250)">
      <rect x="0.5" y="0.5" width="123" height="33" rx="6" fill="#FFFFFF" stroke="#E4E6EA"/>
      <text x="62" y="23" text-anchor="middle" fill="#454A53">better-auth</text>
    </g>
  </g>
</svg>
